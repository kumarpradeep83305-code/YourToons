<style>

.cw svg{display:block;width:100%}.tx{font-weight:800;font-size:7cqw;color:#fff;text-shadow:0 2px 6px #000;white-space:nowrap}.em{font-size:14cqw;line-height:1}

/* ===== Full-screen editor (landscape) ===== */

/* ===== Character expressions (animated, work for any character) ===== */
/* joints: shoulder(.la/.ra) > elbow(.la2/.ra2) ; hip(.ll/.rl) > knee(.ll2/.rl2) */
.pb,.ll,.rl,.ll2,.rl2,.la,.ra,.la2,.ra2,.tor,.hd{transform-box:view-box}
.pb{transform-origin:50px 176px;transition:transform .5s ease}
.ll{transform-origin:43.5px 121px}.rl{transform-origin:56.5px 121px}.ll2{transform-origin:43.5px 146px}.rl2{transform-origin:56.5px 146px}
.la{transform-origin:29px 78px}.ra{transform-origin:71px 78px}.la2{transform-origin:29px 101px}.ra2{transform-origin:71px 101px}
.tor{transform-origin:50px 120px}.hd{transform-origin:50px 66px}
.la,.ll{--s:1}.ra,.rl{--s:-1}
.la2,.ra2{transform:rotate(calc(var(--s)*-5deg))}
.cl,.fd,.zz,.lgh,.pw,.pw2,.stars,.ph,.lt,.xf,.lov{display:none}
.pw,.pw2,.stars{transform-box:fill-box;transform-origin:50% 50%}
.mo2{transform-box:fill-box;transform-origin:50% 0}
.fc,.tear{transform-box:fill-box}.fc{transform-origin:50% 30%}
.vz{display:none}.vz.on{display:inline}

/* blink on every active expression */
[data-ex]:not([data-ex=none]) .fc{animation:xBl 4.5s linear infinite}
/* normal (alive idle) */
[data-ex=normal] .pb,[data-ex=idle] .pb{animation:xBr 3.6s ease-in-out infinite}
[data-ex=normal] .hd,[data-ex=idle] .hd{animation:xTl 5s ease-in-out infinite}
[data-ex=normal] .la,[data-ex=normal] .ra,[data-ex=idle] .la,[data-ex=idle] .ra{animation:xAi 3.6s ease-in-out infinite}
[data-ex=normal] .la2,[data-ex=normal] .ra2,[data-ex=idle] .la2,[data-ex=idle] .ra2{animation:xFi 3.6s ease-in-out infinite}
[data-ex=normal] .ra,[data-ex=normal] .ra2,[data-ex=idle] .ra,[data-ex=idle] .ra2{animation-delay:-1.4s}
/* walk */
[data-ex=walk] .pb{animation:xWB .9s ease-in-out infinite}
[data-ex=walk] .ll,[data-ex=walk] .rl{animation:xWT .9s ease-in-out infinite}
[data-ex=walk] .ll2,[data-ex=walk] .rl2{animation:xWK .9s ease-in-out infinite}
[data-ex=walk] .rl,[data-ex=walk] .rl2,[data-ex=walk] .la,[data-ex=walk] .la2{animation-delay:-.45s}
[data-ex=walk] .la,[data-ex=walk] .ra{animation:xWU .9s ease-in-out infinite}
[data-ex=walk] .la2,[data-ex=walk] .ra2{animation:xWF .9s ease-in-out infinite}
[data-ex=walk] .la,[data-ex=walk] .la2{animation-delay:-.45s}
[data-ex=walk] .hd{animation:xTl .9s ease-in-out infinite}
/* run */
[data-ex=run] .pb{animation:xRB .52s ease-in-out infinite}
[data-ex=run] .ll,[data-ex=run] .rl{animation:xRT .52s ease-in-out infinite}
[data-ex=run] .ll2,[data-ex=run] .rl2{animation:xRK .52s ease-in-out infinite}
[data-ex=run] .rl,[data-ex=run] .rl2{animation-delay:-.26s}
[data-ex=run] .la,[data-ex=run] .ra{animation:xRU .52s ease-in-out infinite}
[data-ex=run] .la{animation-delay:-.26s}
[data-ex=run] .la2,[data-ex=run] .ra2{transform:rotate(calc(var(--s)*-80deg))}
[data-ex=run] .hd{animation:xTl .52s ease-in-out infinite}
/* jump */
[data-ex=jump] .pb{animation:xJ 1.2s infinite}
[data-ex=jump] .la,[data-ex=jump] .ra{animation:xJU 1.2s ease-in-out infinite}
[data-ex=jump] .la2,[data-ex=jump] .ra2{animation:xJF 1.2s ease-in-out infinite}
[data-ex=jump] .ll,[data-ex=jump] .rl{animation:xJT 1.2s ease-in-out infinite}
[data-ex=jump] .ll2,[data-ex=jump] .rl2{animation:xJK 1.2s ease-in-out infinite}
/* dance */
[data-ex=dance] .pb{animation:xDB 1s ease-in-out infinite}
[data-ex=dance] .la,[data-ex=dance] .ra{animation:xDU 1s ease-in-out infinite}
[data-ex=dance] .la2,[data-ex=dance] .ra2{animation:xDF 1s ease-in-out infinite}
[data-ex=dance] .ll,[data-ex=dance] .rl{animation:xDL 1s ease-in-out infinite}
[data-ex=dance] .ll2,[data-ex=dance] .rl2{animation:xDK 1s ease-in-out infinite}
[data-ex=dance] .ra,[data-ex=dance] .ra2,[data-ex=dance] .rl,[data-ex=dance] .rl2{animation-delay:-.5s}
[data-ex=dance] .hd{animation:xDH .5s ease-in-out infinite alternate}
[data-ex=dance] .tor{animation:xDS 1s ease-in-out infinite}
/* punch */
[data-ex=punch] .la,[data-ex=punch] .ra{animation:xPJ 1.1s ease-in-out infinite}
[data-ex=punch] .la2,[data-ex=punch] .ra2{animation:xPF 1.1s ease-in-out infinite}
[data-ex=punch] .la,[data-ex=punch] .la2{animation-delay:-.55s}
[data-ex=punch] .pb{animation:xPb 1.1s ease-in-out infinite}
[data-ex=punch] .ll,[data-ex=punch] .rl{transform:rotate(calc(var(--s)*8deg))}
[data-ex=punch] .ll2,[data-ex=punch] .rl2{transform:rotate(calc(var(--s)*-12deg))}
[data-ex=punch] .pw{display:inline;animation:xPop 1.1s ease-out infinite}
[data-ex=punch] .pw2{display:inline;animation:xPop 1.1s ease-out infinite;animation-delay:-.55s}
/* punch reaction */
[data-ex=punch_react] .pb{animation:xPRb 1.6s ease-out infinite}

<body>
<div id="app">
  <section id="explore" class="screen on">
    <h1>Create your first story</h1>
    <p>Tap the + button below<br>to start a new project.</p>
  </section>
  <section id="profile" class="screen">
    <div class="top">
      <button class="mb" id="menuBtn" aria-label="Menu"><i data-ic="menu"></i></button>
      <span class="logo">Yourtoon</span>
      <button class="up" id="upBtn">Upgrade</button>
    </div>
    <div class="hero">
      <button class="ed" id="editBtn" aria-label="Edit profile"><i data-ic="pencil"></i></button>
      <div class="ring" id="avBtn"><div class="in" id="avIn"></div><span class="cam"><i data-ic="camera"></i></span></div>
      <div class="pn" id="pName"></div><div class="pe" id="pEmail"></div>

  <nav id="bar">
    <button class="tab on" data-tab="explore" aria-label="Explore"><i data-ic="compass"></i><b></b></button>

    <div class="bump"></div>
    <button id="fab" aria-label="Create"><i data-ic="add"></i></button>

  <div id="scrim"></div>
  <aside id="drawer">
    <div class="dhd"><span>Menu</span><button id="dClose" aria-label="Close"><i data-ic="close"></i></button></div>

    <div class="dfoot"><div>Version 0.1 (1)</div><button id="delBtn">Delete my account</button></div>
  </aside>
  <div id="flow"></div>
  <div id="toast"></div>
  <input type="file" id="pf" accept="image/*" hidden>
</div>

let tt;
function toast(m){ const t=$('#ed.on')?$('#etoast'):$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2000); }

const esc = x => String(x).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dlg(title, body, actions){
  const o=document.createElement('div'); o.className='ov';
  const d=document.createElement('div'); d.className='dg'; d.innerHTML=`<h3>${title}</h3>`; d.appendChild(body);
  const a=document.createElement('div'); a.className='da';
  actions.forEach(x=>{ const b=document.createElement('button'); b.textContent=x.l; if(x.c) b.className=x.c; b.onclick=()=>{ if(!x.fn || x.fn()!==false) o.remove(); }; a.appendChild(b); });
  d.appendChild(a); o.appendChild(d); o.onclick=e=>{ if(e.target===o) o.remove(); }; ($('#ed.on')||$('#app')).appendChild(o);
}

// ---- Screens ----
function show(tab){
  document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on', e.id===tab));
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on', e.dataset.tab===tab));
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));

$('#upBtn').onclick = () => upDlg();

function renderProfile(){
  $('#pName').textContent=S.name; $('#pEmail').textContent=S.email;
  const av=$('#avIn');
  if(S.avatar){ av.style.backgroundImage=`url(${S.avatar})`; av.textContent=''; }
  else { av.style.backgroundImage=''; av.textContent=(S.name.trim()[0]||'Y').toUpperCase(); }
}
// ---- Profile edit ----
$('#editBtn').onclick = () => {
  const b=h('<input type="text" id="fn" placeholder="Name"><input type="text" id="fe" placeholder="Email">');
  b.querySelector('#fn').value=S.name; b.querySelector('#fe').value=S.email;
  dlg('Edit profile', b, [{l:'Cancel'},{l:'Save',c:'pri',fn:()=>{ S.name=b.querySelector('#fn').value.trim()||S.name; S.email=b.querySelector('#fe').value.trim()||S.email; save(); renderProfile(); }}]);
};
$('#avBtn').onclick = () => $('#pf').click();
$('#pf').onchange = e => {
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(); img.onload=()=>{
    const c=document.createElement('canvas'); c.width=c.height=256;
    const m=Math.min(img.width,img.height); c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,256,256);
    S.avatar=c.toDataURL('image/jpeg',.85); save(); renderProfile();
  }; img.src=URL.createObjectURL(f); e.target.value='';
};

  dlg(title,b,[{l:'Cancel'},{l:'OK',c:'pri',fn:()=>{ const c=b.querySelector('input:checked'); if(c){ S[key]=c.value; save(); toast(title+': '+c.value); } }}]);
}

function renderMenu(){
  const m=$('#menu'); m.innerHTML='';

    if(gi){ const d=document.createElement('li'); d.className='gp'; m.appendChild(d); }
    g.forEach(it=>{
      const li=document.createElement('li');
      li.innerHTML=`<button><span class="tile" style="--c:${it.col[0]};--b:${it.col[1]};--c2:${it.col[2]}"><i data-ic="${it.ic}"></i></span><span class="l">${it.l}</span>${it.sw?`<span class="sw ${S.debug?'on':''}"></span>`:`<span class="go"><i data-ic="${it.out?'out':'chev'}"></i></span>`}</button>`;
      li.firstChild.onclick=()=>{ if(!it.sw) closeMenu(); it.f(); };
      m.appendChild(li);
    });
  });
  paint(m);
}
const openMenu=()=>$('#app').classList.add('open'), closeMenu=()=>$('#app').classList.remove('open');

  Object.keys(HC).forEach(k=>{const g=hg.querySelector(`[data-h="${k}"]`),off=vw==='side'&&/^r/.test(k)?5:0;g.querySelectorAll('circle').forEach(ci=>{ci.setAttribute('cx',q[k][0]+off);ci.setAttribute('cy',q[k][1]);});});};
 const lbl=()=>{o.querySelector('#cuk').textContent='◆ Keyframe · '+c.steps.length;};
 const show=()=>{cuApply(sv,P());place();lbl();};
 const stop=()=>{if(raf){cancelAnimationFrame(raf);raf=0;}hg.style.display='';const b=o.querySelector('#cupl');if(b)b.textContent='▶ Play';cuApply(sv,P());};
 const play=()=>{if(raf)return stop();if(c.steps.length<2)return toast('Tap ◆ Keyframe, move the dots, then Play');
  hg.style.display='none';o.querySelector('#cupl').textContent='■ Stop';const t0=performance.now();
  const tick=ts=>{const seq=c.steps.concat([c.steps[0]]),f=(((ts-t0)/1000)%c.dur)/c.dur*(seq.length-1),i=Math.min(Math.floor(f),seq.length-2),u=EASE.ease(f-i),p={};
   Object.keys(seq[0]).forEach(k=>{p[k]=seq[i][k]+(seq[i+1][k]-seq[i][k])*u;});cuApply(sv,p);raf=requestAnimationFrame(tick);};
  raf=requestAnimationFrame(tick);};
 const loc=e=>{const m=hg.getScreenCTM();if(!m)return null;const Q=sv.createSVGPoint();Q.x=e.clientX;Q.y=e.clientY;const r=Q.matrixTransform(m.inverse());return[r.x,r.y];};
 const nrm=a=>((a+180)%360+360)%360-180;
 sv.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-h]');if(!h||raf)return;drag=h.dataset.h;try{sv.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
 sv.addEventListener('pointermove',e=>{if(!drag)return;const l=loc(e);if(!l)return;const p=P(),g=CUG(vw),ang=(x,y)=>Math.atan2(l[1]-y,l[0]-x)*180/Math.PI;
  if(drag==='hd')p.hd=Math.max(-40,Math.min(40,Math.round(nrm(ang(50,66)+90))));
  else if(drag.length===2)p[drag]=Math.round(nrm(ang(g[drag][0],g[drag][1])-90));
  else{const b=drag.slice(0,2),q=cuPts(p,vw);p[drag]=Math.round(nrm(ang(q[b][0],q[b][1])-90-p[b]));}
  cuApply(sv,p);place();e.preventDefault();});
 const end=()=>{drag=null;};sv.addEventListener('pointerup',end);sv.addEventListener('pointercancel',end);
 o.addEventListener('pointerdown',e=>e.stopPropagation());
 o.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-k]');if(!b||b.closest('svg'))return;const k=b.dataset.k;
  if(k==='close'){stop();o.remove();}
  else if(k==='play'){play();}
  else if(k==='add'){stop();c.steps.splice(cur+1,0,JSON.parse(JSON.stringify(P())));cur++;show();toast('Keyframe '+c.steps.length+' added – now move the dots');}
  else if(k==='save'){stop();
   const ix=CU.findIndex(x=>x.id===c.id);if(ix>=0)CU[ix]=c;else CU.push(c);CUD[c.id]=c;cuSave();cuBuild();o.remove();
   if(XS){XS.k=c.id;XS.tab='cus';xTiles();liveSet(it);}toast('Animation saved');}});
 show();}

 xcnew:()=>cuOpen(null),
 xcedit:()=>{if(XS&&CUD[XS.k]&&CU.some(c=>c.id===XS.k))cuOpen(XS.k);},
 xcdel:()=>{const id=XS&&XS.k;if(!id||!CU.some(c=>c.id===id))return;
  dlg('Delete animation?',h('<p>“'+esc((CUD[id]||{}).name||'')+'” will be removed from your Custom list.</p>'),[{l:'Cancel'},{l:'Delete',c:'pri',fn:()=>{CU=CU.filter(c=>c.id!==id);cuSave();XS.k=null;const it=gi2();if(it)liveSet(it);xTiles();}}]);}
});

// ===== Permissions: first-run gate + help when the mic is blocked =====
const secOK=()=>window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
async function askMic(){
 if(!secOK())return micHelp({name:'Insecure'});
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());document.querySelectorAll('.ov').forEach(o=>o.remove());toast('Microphone allowed ✅');}
 catch(e){document.querySelectorAll('.ov').forEach(o=>o.remove());micHelp(e);}}
function micHelp(e){
 const n=e&&e.name,bad=n==='Insecure'||!secOK();
 const body=bad?'<p>The microphone does not work on this page because it is not opened from a secure <b>https://</b> address (a downloaded file opened from storage is blocked by the browser).</p><p><b>Fix:</b> upload this HTML to any https hosting (Netlify, GitHub Pages, Supabase hosting…) and open that link in Chrome. The permission popup will then appear.</p>'
 :n==='NotFoundError'?'<p>No microphone was found on this device.</p>'
 :'<p>Microphone is blocked for this site. A website cannot open phone settings by itself, so please:</p><p>1. Tap the 🔒 / ⚙ icon next to the address bar<br>2. Permissions → Microphone → <b>Allow</b><br>3. Come back and tap <b>Try again</b></p><p>Or: Chrome ⋮ → Settings → Site settings → Microphone → Allow.</p>';
 dlg('Microphone permission',h(body),bad?[{l:'OK',c:'pri'}]:[{l:'Close'},{l:'Try again',c:'pri',fn:()=>{askMic();return false;}}]);}
async function micGate(){
 try{if(navigator.permissions){const p=await navigator.permissions.query({name:'microphone'});if(p.state==='granted')return;}}catch(e){}
 dlg('Allow permissions',h('<p>To record your dialogue and lip-sync the character, Yourtoon needs the <b>microphone</b>.</p><p>Saving exported videos to your gallery: after Export, tap <b>Save to Gallery</b> and choose <b>Save Video</b> — Android/iPhone ask for that access themselves.</p>'),[{l:'Later'},{l:'Allow microphone',c:'pri',fn:()=>{askMic();return false;}}]);}
// permission popup on startup disabled (microphone is asked only when you tap the mic)

// ===== Touch drag-scroll for bottom tool bars (works in portrait and rotated landscape) =====
(function(){let d=null,mv=0,raf=0,last=null;const SEL='#ebt,#frs,#sheet .tools,#xsheet .tools';
 const stopInertia=()=>{if(raf){cancelAnimationFrame(raf);raf=0;}};
 ED.addEventListener('pointerdown',e=>{stopInertia();const c=e.target.closest(SEL);d=c?{c,x:e.clientX,y:e.clientY,s:c.scrollLeft}:null;mv=0;last=d?{p:d.s,t:performance.now(),v:0}:null;});
 ED.addEventListener('pointermove',e=>{if(!d)return;const dx=ED.classList.contains('rot')?e.clientY-d.y:e.clientX-d.x;
  if(Math.abs(dx)>6&&!mv){mv=1;d.c.classList.add('dragging');}
  if(mv){d.c.scrollLeft=d.s-dx;const n=performance.now(),dt=n-last.t;if(dt>0){const v=(d.c.scrollLeft-last.p)/dt;last.v=last.v*.6+v*.4;}last.p=d.c.scrollLeft;last.t=n;e.preventDefault();}});
 const up=()=>{if(!d)return;const c=d.c;c.classList.remove('dragging');
  if(mv&&last&&performance.now()-last.t<80&&Math.abs(last.v)>.15){let v=last.v,t0=performance.now();
   const step=n=>{const dt=n-t0;t0=n;c.scrollLeft+=v*dt;v*=Math.pow(.995,dt);if(Math.abs(v)>.03&&c.scrollLeft>0&&c.scrollLeft<c.scrollWidth-c.clientWidth)raf=requestAnimationFrame(step);else raf=0;};raf=requestAnimationFrame(step);}
  d=null;};
 ED.addEventListener('pointerup',up);ED.addEventListener('pointercancel',up);
 ED.addEventListener('click',e=>{if(mv){e.stopPropagation();e.preventDefault();mv=0;}},true);})();

// ===== Props held in the character's hand =====
function giveProp(v){const cs=E.items.filter(i=>i.t==='char');if(!cs.length)return addIt('emoji',v,{y:65});
 const go=(c,k)=>{pushH();c.o.hold=Object.assign({},c.o.hold,{[k]:v});edRender();edSave();toast('Prop in '+(k==='r'?'right':'left')+' hand');};
 pick('Hold the prop in…',[{k:'r',h:'<span class="pe">🫱</span>Right hand'},{k:'l',h:'<span class="pe">🫲</span>Left hand'},{k:'s',h:'<span class="pe">📍</span>Place on stage'}],k=>{
  if(k==='s')return addIt('emoji',v,{y:65});
  const c=cs.find(x=>x.id===E.sel)||(cs.length===1&&cs[0]);
  if(c)go(c,k);else pick('Which character?',cs.map(c=>({k:c.id,h:`<span class="pc">${chr(c.o,'10 0 80 190')}</span>#${c.id}`})),id=>go(cs.find(x=>x.id==id),k),3);},3);}
function holdTool(it){const hd=it.o.hold||{},o=[];
 if(hd.r)o.push({k:'r',h:`<span class="pe">${hd.r}</span>Remove from right hand`});if(hd.l)o.push({k:'l',h:`<span class="pe">${hd.l}</span>Remove from left hand`});
 if(!o.length)return toast('No prop in hands — use Add Props');
