function edDrag(){const s=$('#stg'),P=new Map();let g=null;

const EASE={linear:u=>u,ease:u=>u*u*(3-2*u),in:u=>u*u*u,out:u=>1-(1-u)**3,bounce:u=>{const n=7.5625,d=2.75;if(u<1/d)return n*u*u;if(u<2/d)return n*(u-=1.5/d)*u+.75;if(u<2.5/d)return n*(u-=2.25/d)*u+.9375;return n*(u-=2.625/d)*u+.984375},elastic:u=>u<=0||u>=1?u:2**(-10*u)*Math.sin((u*10-.75)*2*Math.PI/3)+1,hold:u=>u<1?0:1};
const KP=['x','y','s','r','o'],tid=x=>x==='bg'?x:+x;
const iv=i=>({x:i.x,y:i.y,s:i.sc||1,r:i.rot||0,o:i.op==null?1:i.op}),bv=b=>({x:b.x,y:b.y,s:b.s,r:0,o:1});

const kfAny=()=>Object.values(E.kf).some(t=>t&&t.length);
const kfB=on=>{const b=$('#kpb');if(b)b.innerHTML=on?IC.stop:IC.play;};
const opSet=(it,v)=>{it.op=v;const el=document.querySelector(`#stg .it[data-id="${it.id}"]`);if(el)el.style.opacity=v;};

// ===== Permissions: first-run gate + help when the mic is blocked =====
const secOK=()=>window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
async function askMic(){
 if(!secOK())return micHelp({name:'Insecure'});
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());document.querySelectorAll('.ov').forEach(o=>o.remove());toast('Microphone allowed ✅');}
 catch(e){document.querySelectorAll('.ov').forEach(o=>o.remove());micHelp(e);}}
function micHelp(e){
 const n=e&&e.name,bad=n==='Insecure'||!secOK();
 const body=bad?'<p>The microphone does not work on this page because it is not opened from a secure <b>https://</b> address (a downloaded file opened from storage is blocked by the browser).</p><p><b>Fix:</b> upload this HTML to any https hosting (Netlify, GitHub Pages, Supabase hosting…) and open that link in Chrome. The permission popup will then appear.</p>'
 :n==='NotFoundError'?'<p>No microphone was found on this device.</p>'
 :'<p>Microphone is blocked for this site. A website cannot open phone settings by itself, so please:</p><p>1. Tap the 🔒 / ⚙ icon next to the address bar<br>2. Permissions → Microphone → <b>Allow</b><br>3. Come back and tap <b>Try again</b></p><p>Or: Chrome ⋮ → Settings → Site settings → Microphone → Allow.</p>';
 dlg('Microphone permission',h(body),bad?[{l:'OK',c:'pri'}]:[{l:'Close'},{l:'Try again',c:'pri',fn:()=>{askMic();return false;}}]);}
async function micGate(){
 try{if(navigator.permissions){const p=await navigator.permissions.query({name:'microphone'});if(p.state==='granted')return;}}catch(e){}
 dlg('Allow permissions',h('<p>To record your dialogue and lip-sync the character, Yourtoon needs the <b>microphone</b>.</p><p>Saving exported videos to your gallery: after Export, tap <b>Save to Gallery</b> and choose <b>Save Video</b> — Android/iPhone ask for that access themselves.</p>'),[{l:'Later'},{l:'Allow microphone',c:'pri',fn:()=>{askMic();return false;}}]);}
// permission popup on startup disabled (microphone is asked only when you tap the mic)

(function(){let d=null,mv=0,raf=0,last=null;const SEL='#ebt,#frs,#sheet .tools,#xsheet .tools';

 ED.addEventListener('pointermove',e=>{if(!d)return;const dx=ED.classList.contains('rot')?e.clientY-d.y:e.clientX-d.x;
  if(Math.abs(dx)>6&&!mv){mv=1;d.c.classList.add('dragging');}
  if(mv){d.c.scrollLeft=d.s-dx;const n=performance.now(),dt=n-last.t;if(dt>0){const v=(d.c.scrollLeft-last.p)/dt;last.v=last.v*.6+v*.4;}last.p=d.c.scrollLeft;last.t=n;e.preventDefault();}});

  if(mv&&last&&performance.now()-last.t<80&&Math.abs(last.v)>.15){let v=last.v,t0=performance.now();
   const step=n=>{const dt=n-t0;t0=n;c.scrollLeft+=v*dt;v*=Math.pow(.995,dt);if(Math.abs(v)>.03&&c.scrollLeft>0&&c.scrollLeft<c.scrollWidth-c.clientWidth)raf=requestAnimationFrame(step);else raf=0;};raf=requestAnimationFrame(step);}
  d=null;};

 ED.addEventListener('click',e=>{if(mv){e.stopPropagation();e.preventDefault();mv=0;}},true);})();
